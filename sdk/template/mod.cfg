[mod]
name = "My Mod"
version = "1.0.0"
author = "Your Name"
description = "Short description of what the mod does."
game_version = "2.8.5"
load_order = 10
; config_editable = true   # Uncomment to enable config editor UI in Mods Menu
;                          # Раскомментируй для UI-редактора конфига в Mods Menu

[dependencies]
; other_mod_id = true      # .pck filename without extension / имя .pck без расширения

[config]
; my_option = true         # Default values - available in _init_mod(config)
; my_value = 1.0           # Значения по умолчанию - доступны в _init_mod(config)
